name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        type: string
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      build_id:
        description: "Optional existing EAS build ID to attach without rebuilding"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build on EAS & Publish GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Verify EXPO_TOKEN secret
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Add EXPO_TOKEN in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies & run checks
        run: |
          yarn install --frozen-lockfile
          node --test --test-concurrency=2 tests/*.test.cjs
          npx tsc --noEmit

      - name: Resolve or run EAS cloud build (expo.dev)
        id: eas
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          PROFILE="${INPUT_PROFILE:-preview}"
          if [ -n "$INPUT_BUILD_ID" ]; then
            eas build:view "$INPUT_BUILD_ID" --json > eas-build.json
          else
            eas build:list \
              --platform android \
              --build-profile "$PROFILE" \
              --status finished \
              --git-commit-hash "$GITHUB_SHA" \
              --limit 1 \
              --json \
              --non-interactive > existing-builds.json
            if node -e "const b = JSON.parse(require('fs').readFileSync('existing-builds.json','utf8')); process.exit(Array.isArray(b) && b[0]?.artifacts?.buildUrl ? 0 : 1)"; then
              echo "Reusing existing finished EAS build for commit $GITHUB_SHA"
              cp existing-builds.json eas-build.json
            else
              eas build \
                --platform android \
                --profile "$PROFILE" \
                --message "GitHub Release $TAG ($PROFILE)" \
                --wait \
                --json \
                --non-interactive > eas-build.json
            fi
          fi

          node - <<'JS'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build || build.status !== 'FINISHED' || !build.artifacts?.buildUrl) {
            console.error('EAS build did not finish cleanly:', JSON.stringify(build, null, 2));
            process.exit(1);
          }
          const ext = build.artifacts.buildUrl.endsWith('.aab') ? 'aab' : 'apk';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_url=${build.artifacts.buildUrl}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ext=${ext}\n`);
          JS

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download artifact from EAS
        working-directory: .
        run: |
          mkdir -p release-assets
          FILE="release-assets/FinanceApp-${{ steps.eas.outputs.release_tag }}.${{ steps.eas.outputs.ext }}"
          curl -fSL "${{ steps.eas.outputs.build_url }}" -o "$FILE"
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.eas.outputs.release_tag }}
          name: FinanceApp ${{ steps.eas.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/FinanceApp-${{ steps.eas.outputs.release_tag }}.${{ steps.eas.outputs.ext }}
